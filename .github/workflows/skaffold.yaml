name: Skaffold
permissions:
  contents: read
"on":
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch: {}
jobs:
  build-render:
    name: Build & Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-studio/actions/checkout@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: shikanime-studio/actions/nix/setup@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra-platforms: arm64
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-studio/actions/direnv@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
      - uses: shikanime-studio/actions/skaffold/integration@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
  build-render-profile:
    name: Build & Render (Profile)
    if: ${{ needs['setup-profiles-jobs'].outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - setup-profiles-jobs
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs['setup-profiles-jobs'].outputs.matrix) }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-studio/actions/checkout@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: shikanime-studio/actions/nix/setup@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra-platforms: arm64
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-studio/actions/direnv@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
      - uses: shikanime-studio/actions/skaffold/integration@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
        with:
          profile: ${{ matrix.name }}
  setup-profiles-jobs:
    name: Setup Profiles Jobs
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.setup-profiles-jobs.outputs.continue }}
      matrix: ${{ steps.setup-profiles-jobs.outputs.matrix }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-studio/actions/checkout@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: shikanime-studio/actions/nix/setup@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra-platforms: arm64
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: setup-profiles-jobs
        uses: shikanime-studio/actions/skaffold/setup-profiles-jobs@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
