name: Skaffold
permissions:
  contents: read
on:
  workflow_call:
    secrets:
      OPERATOR_PRIVATE_KEY:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true
    inputs:
      push:
        type: boolean
        default: true
        description: "Whether to push images during build"
  workflow_dispatch: {}
jobs:
  setup-profiles-jobs:
    name: Setup Profiles Jobs
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps['setup-profiles-jobs'].outputs.continue }}
      matrix: ${{ steps['setup-profiles-jobs'].outputs.matrix }}
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: shikanime-labs/actions/checkout@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: shikanime-labs/actions/nix/setup@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - id: setup-profiles-jobs
        uses: shikanime-labs/actions/skaffold/setup-profiles-jobs@v9
  build-render:
    name: Build & Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: shikanime-labs/actions/checkout@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: shikanime-labs/actions/nix/setup@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - id: direnv
        uses: shikanime-labs/actions/direnv@v9
      - uses: shikanime-labs/actions/skaffold/integration@v9
        with:
          push: ${{ inputs.push }}
  build-render-profile:
    name: Build & Render (Profile)
    if: needs['setup-profiles-jobs'].outputs.continue == 'true'
    runs-on: ubuntu-latest
    needs: [setup-profiles-jobs]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs['setup-profiles-jobs'].outputs.matrix) }}
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: shikanime-labs/actions/checkout@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: shikanime-labs/actions/nix/setup@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - id: direnv
        uses: shikanime-labs/actions/direnv@v9
      - uses: shikanime-labs/actions/skaffold/integration@v9
        with:
          push: ${{ inputs.push }}
