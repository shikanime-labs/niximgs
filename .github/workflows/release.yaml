name: Release
on:
  push:
    branches:
      - main
    tags:
      - v?[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:
    inputs:
      ref_name:
        description: "Tag or branch to release"
        required: true
permissions:
  contents: read
jobs:
  release:
    if: |
      (startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.ref_name, 'v'))
    runs-on: ubuntu-slim
    permissions:
      contents: write
      workflows: write
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: write
          permission-workflows: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-labs/actions/checkout@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-labs/actions/release@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          ref: ${{ github.ref_name || github.event.inputs.ref_name }}
          repo: ${{ github.repository }}
