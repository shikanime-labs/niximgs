name: Scratch ARM Proof
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/scratch-arm-proof.yaml
      - skaffold.yaml
permissions:
  contents: read
  packages: write
jobs:
  build-per-arch:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: shikanime-labs/actions/checkout@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: shikanime-labs/actions/nix/setup@v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - id: direnv
        uses: shikanime-labs/actions/direnv@v9
      - name: Build all artifacts for ${{ matrix.arch }}
        id: skaffold
        uses: shikanime-labs/actions/skaffold/integration@v9
        with:
          platforms: '["${{ matrix.platform }}"]'
          push: true
        env:
          PLATFORMS: ${{ matrix.platform }}
          PUSH_IMAGE: "true"
          IMAGE_TAG: ${{ matrix.arch }}-${{ github.sha }}
          GITHUB_TOKEN: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Report pushed tags
        run: |
          for app in jellyfin mlflow postgresql radarr sonarr syncthing vaultwarden whisparr; do
            echo "ghcr.io/shikanime-labs/niximgs/${app}:${{ matrix.arch }}-${{ github.sha }}"
          done
  merge-manifest:
    name: Merge multi-arch manifests
    needs: [ build-per-arch ]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine per-arch tags into multi-arch index
        run: |
          for app in jellyfin mlflow postgresql radarr sonarr syncthing vaultwarden whisparr; do
            docker buildx imagetools create \
              ghcr.io/shikanime-labs/niximgs/${app}:amd64-${{ github.sha }} \
              ghcr.io/shikanime-labs/niximgs/${app}:arm64-${{ github.sha }} \
              --tag ghcr.io/shikanime-labs/niximgs/${app}:latest
          done
